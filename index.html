<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuğra Sandbox - Eğlence Parkı</title>
  <style>
    :root {
      --bg-color: #1a1a2e;
      --panel-bg: rgba(22, 33, 62, 0.85);
      --accent: #e94560;
      --text: #ffffff;
      --btn-hover: #0f3460;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #game-container {
      position: relative;
      flex: 1;
      width: 100vw;
      height: calc(100vh - 120px);
      background: radial-gradient(circle at center, #16213e 0%, #0f3460 100%);
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Üst Bilgi Paneli */
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .stat-card {
      background: var(--panel-bg);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      pointer-events: auto;
    }

    .health-bar-container {
      width: 200px;
      height: 16px;
      background: #333;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 6px;
      border: 1px solid rgba(255,255,255,0.2);
    }
